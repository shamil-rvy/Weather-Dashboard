<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <button id="themeBtn">🌙</button>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button id="searchBtn">
                Search
            </button>

        </section>
        <!-- Error Message -->
        <p id="errorMsg"></p>


        <!-- Loading -->
        <p id="loading">Loading...</p>


        <!-- Current Weather -->
        <section id="weatherCard" class="weather-card">

            <h2 id="cityName">City Name</h2>

            <div class="weather-info">


                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="description">Weather condition</p>
                </div>

            </div>

            <div class="details">

                <p>
                    💧 Humidity:
                    <span id="humidity">--</span>%
                </p>

                <p>
                    💨 Wind:
                    <span id="wind">--</span> km/h
                </p>

            </div>

            <button id="favoriteBtn">
                ⭐ Add to Favorites
            </button>

        </section>
        <!-- 5 Day Forecast -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div id="forecast" class="forecast-container">

                <!-- Forecast cards will come here using JavaScript -->

            </div>

        </section>

        <!-- Favorites -->
        <section class="favorites-section">

            <h2>⭐ Favorite Cities</h2>

            <div id="favoritesList">

                <!-- Favorite cities will come here -->
            </div>

        </section>

    </div>
    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
